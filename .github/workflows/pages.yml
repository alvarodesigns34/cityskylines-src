name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publica empujando a la rama `gh-pages`, que es la fuente que GitHub Pages activó solo
# al crearla. La vía oficial (`actions/configure-pages` + `deploy-pages`) necesita permiso
# de administración para dar de alta el sitio, y el token del workflow no lo tiene:
# fallaba con "Resource not accessible by integration".
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Si algo se rompe, no llega a producción.
      - run: npm run typecheck
      - run: node --experimental-strip-types --import ./scripts/register-ts.mjs --test 'src/game/**/*.test.ts'

      - name: Construir la versión estática
        run: npm run build:pages
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      - name: Preparar la publicación
        run: |
          cp dist-pages/index.html dist-pages/404.html
          touch dist-pages/.nojekyll

      - name: Empujar a gh-pages
        run: |
          cd dist-pages
          git init -q
          git checkout -qb gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publica ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

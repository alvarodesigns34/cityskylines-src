name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llegan varios pushes, gana el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Comprobaciones antes de publicar: si algo se rompe, no llega a producción.
      - run: npm run typecheck
      - run: node --experimental-strip-types --import ./scripts/register-ts.mjs --test 'src/game/**/*.test.ts'

      - name: Construir la versión estática
        run: npm run build:pages
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      # El juego es una sola ruta: cualquier subruta cae en el mismo SPA.
      - run: cp dist-pages/index.html dist-pages/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
